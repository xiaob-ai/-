           L 95 60
           L 95 55
           L 65 55
           L 65 45
           L 55 45
           L 55 55
           L 40 55
           L 40 65
           L 55 65
           L 55 95
           L 65 95
           L 65 65
           L 75 65
           L 75 85
           L 85 85
           L 85 65
           L 95 65
           L 95 75
           L 105 75
           L 105 60
           L 85 60
           L 85 50
           L 75 50
           L 75 60
           Z"
          fill="white"/>

    <!-- 汉字"知" - 口 -->

           C 120 180, 140 175, 155 165
           L 180 180
           L 172 150
           C 185 135, 180 120, 180 100
           C 180 55, 145 20, 100 20 Z"
          fill="#0084FF"/>

    <!-- 汉字"知" - 矢 -->
